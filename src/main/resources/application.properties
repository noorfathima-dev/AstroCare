spring.application.name=astrocare
server.port=8081
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:astrocare_db}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:change_me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
security.jwt.secret=${JWT_SECRET:change-this-development-secret-to-a-random-256-bit-value}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
astrocare.seed.enabled=${ASTROCARE_SEED_ENABLED:true}
astrocare.seed.default-password=${ASTROCARE_SEED_PASSWORD:AstroCare!2026#Orbit}
