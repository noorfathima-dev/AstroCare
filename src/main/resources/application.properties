spring.application.name=astrocare

# --- MySQL 8.0.16+ (CHECK constraints are enforced from 8.0.16) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:astrocare}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:change_me}

# schema.sql is the source of truth, Hibernate must not touch DDL
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Seeder (runs once, skipped if surgeon.vance already exists, never under profile "prod") ---
astrocare.seed.enabled=true
astrocare.seed.default-password=${ASTROCARE_SEED_PASSWORD:AstroCare!2026#Orbit}
